<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Midjourney Public Archive</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f3ed;
        --ink: #171717;
        --muted: #645f57;
        --line: #d8d0c4;
        --card: #ffffff;
        --accent: #1d7669;
        --danger: #b73324;
        --shadow: 0 18px 36px rgb(31 28 23 / 12%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151413;
          --ink: #f4f0e9;
          --muted: #b8afa5;
          --line: #3a352e;
          --card: #201e1b;
          --accent: #78c6b7;
          --danger: #f18b79;
          --shadow: 0 18px 36px rgb(0 0 0 / 32%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      header {
        border-bottom: 1px solid var(--line);
        padding: 24px clamp(16px, 5vw, 56px) 18px;
      }

      .topbar {
        align-items: start;
        display: flex;
        gap: 18px;
        justify-content: space-between;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 5vw, 54px);
        line-height: 1;
        letter-spacing: 0;
      }

      .meta {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        font-size: 14px;
      }

      .toolbar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }

      .tabs button,
      .toolbar button {
        border-radius: 8px;
        min-height: 38px;
        padding: 7px 12px;
      }

      button[aria-pressed="true"],
      .toolbar button.active {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }

      main {
        padding: 24px clamp(16px, 5vw, 56px) 56px;
      }

      .grid {
        display: grid;
        gap: 22px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      }

      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .media {
        align-items: center;
        aspect-ratio: 3 / 4;
        background: #101010;
        display: flex;
        justify-content: center;
        min-height: 320px;
        overflow: hidden;
        position: relative;
      }

      img,
      video {
        display: block;
        height: 100%;
        max-width: 100%;
        object-fit: cover;
        width: 100%;
      }

      .delete {
        align-items: center;
        background: color-mix(in srgb, var(--danger) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--danger) 46%, var(--line));
        border-radius: 8px;
        color: var(--danger);
        display: inline-flex;
        font-size: 18px;
        font-weight: 700;
        height: 32px;
        justify-content: center;
        line-height: 1;
        padding: 0;
        width: 38px;
      }

      .delete:disabled {
        cursor: progress;
        opacity: 0.55;
      }

      .body {
        padding: 14px;
      }

      .body-top {
        align-items: center;
        display: flex;
        gap: 10px;
        justify-content: space-between;
      }

      .label {
        color: var(--danger);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .prompt {
        display: -webkit-box;
        font-size: 14px;
        margin: 8px 0 10px;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }

      a {
        color: var(--accent);
        overflow-wrap: anywhere;
      }

      .empty,
      .notice {
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        padding: 28px;
      }

      .notice {
        margin-bottom: 16px;
        padding: 12px 14px;
      }

      @media (max-width: 640px) {
        .topbar {
          display: block;
        }

        .toolbar {
          justify-content: flex-start;
          margin-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topbar">
        <div>
          <h1>Midjourney Public Archive</h1>
          <div class="meta">
            <span id="updated">No crawl yet</span>
            <span id="counts">0 items</span>
            <span id="status"></span>
          </div>
        </div>
        <div class="toolbar" aria-label="Archive actions">
          <button type="button" id="copyDeletesButton">Copy deletes</button>
          <button type="button" id="clearDeletesButton">Clear deletes</button>
        </div>
      </div>
      <nav class="tabs" aria-label="Archive filters">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="images" aria-pressed="false">Images</button>
        <button type="button" data-filter="videos" aria-pressed="false">Videos</button>
        <button type="button" data-filter="styles" aria-pressed="false">Styles</button>
      </nav>
    </header>
    <main>
      <section id="archive" class="grid" aria-live="polite"></section>
    </main>
    <script>
      const DELETE_QUEUE_KEY = "midjourneyArchivePendingDeletes";

      const archive = document.getElementById("archive");
      const updated = document.getElementById("updated");
      const counts = document.getElementById("counts");
      const statusText = document.getElementById("status");
      const copyDeletesButton = document.getElementById("copyDeletesButton");
      const clearDeletesButton = document.getElementById("clearDeletesButton");
      const buttons = [...document.querySelectorAll("[data-filter]")];

      let archiveData = null;
      let items = [];
      let currentFilter = "all";

      const escapeText = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

      function setStatus(message) {
        statusText.textContent = message || "";
      }

      function pendingDeletes() {
        try {
          const value = JSON.parse(localStorage.getItem(DELETE_QUEUE_KEY) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function pendingDeleteIds() {
        return new Set(pendingDeletes().map((item) => item.id).filter(Boolean));
      }

      function savePendingDeletes(value) {
        localStorage.setItem(DELETE_QUEUE_KEY, JSON.stringify(value));
        updateDeleteButtons();
      }

      function updateDeleteButtons() {
        const total = pendingDeletes().length;
        copyDeletesButton.textContent = total ? `Copy deletes (${total})` : "Copy deletes";
        clearDeletesButton.disabled = total === 0;
      }

      function mediaHtml(item) {
        const source = item.asset_path || item.media_url || item.thumbnail_url;
        if (!source) return "";
        if (item.media_type === "video" && /\.(mp4|webm|mov)(\?|$)/i.test(source)) {
          return `<video src="${escapeText(source)}" controls preload="metadata"></video>`;
        }
        return `<img src="${escapeText(source)}" alt="">`;
      }

      function refreshMeta() {
        updated.textContent = archiveData?.updated_at
          ? `Updated ${new Date(archiveData.updated_at).toLocaleString()}`
          : "No crawl yet";
        const pending = pendingDeletes().length;
        counts.textContent = pending ? `${items.length} items · ${pending} pending delete` : `${items.length} items`;
      }

      function render(filter = currentFilter) {
        currentFilter = filter;
        refreshMeta();
        const deletedIds = pendingDeleteIds();
        const keptItems = items.filter((item) => !deletedIds.has(item.id));
        const visible = filter === "all" ? keptItems : keptItems.filter((item) => item.tab === filter);
        if (!visible.length) {
          archive.className = "empty";
          archive.innerHTML = "저장된 항목이 없습니다. 크롤링이 성공하면 최신 항목이 위에서부터 쌓입니다.";
          return;
        }
        archive.className = "grid";
        archive.innerHTML = visible.map((item) => `
          <article>
            <div class="media">
              ${mediaHtml(item)}
            </div>
            <div class="body">
              <div class="body-top">
                <div class="label">${escapeText(item.tab)}${item.style_code ? ` · sref ${escapeText(item.style_code)}` : ""}</div>
                <button class="delete" type="button" data-delete="${escapeText(item.id)}" aria-label="Queue item for deletion">×</button>
              </div>
              <p class="prompt">${escapeText(item.prompt || item.title || item.id)}</p>
              <a href="${escapeText(item.page_url || item.media_url || "#")}" target="_blank" rel="noreferrer">Open source</a>
            </div>
          </article>
        `).join("");
      }

      async function loadArchive() {
        const response = await fetch("./data/midjourney.json", { cache: "no-store" });
        archiveData = await response.json();
        items = archiveData.items || [];
        updateDeleteButtons();
        render();
      }

      function queueDelete(itemId) {
        const item = items.find((candidate) => candidate.id === itemId);
        if (!item) return;
        const queued = pendingDeletes();
        if (!queued.some((candidate) => candidate.id === itemId)) {
          queued.push({
            id: item.id,
            tab: item.tab,
            asset_path: item.asset_path || null,
            queued_at: new Date().toISOString()
          });
          savePendingDeletes(queued);
        }
        setStatus("Queued for next cleanup");
        render();
      }

      archive.addEventListener("click", (event) => {
        const button = event.target.closest("[data-delete]");
        if (!button) return;
        queueDelete(button.dataset.delete);
      });

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((candidate) => candidate.setAttribute("aria-pressed", String(candidate === button)));
          render(button.dataset.filter);
        });
      });

      copyDeletesButton.addEventListener("click", async () => {
        const queued = pendingDeletes();
        if (!queued.length) {
          setStatus("No pending deletes");
          return;
        }
        const text = JSON.stringify(queued, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          setStatus("Copied pending deletes");
        } catch {
          prompt("삭제 대기 목록", text);
        }
      });

      clearDeletesButton.addEventListener("click", () => {
        if (!pendingDeletes().length) return;
        savePendingDeletes([]);
        setStatus("Pending deletes cleared");
        render();
      });

      updateDeleteButtons();
      loadArchive().catch((error) => {
        archive.className = "empty";
        archive.innerHTML = escapeText(error.message || "데이터를 불러오지 못했습니다.");
      });
    </script>
  </body>
</html>
