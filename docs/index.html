<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Midjourney Public Archive</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f3ed;
        --ink: #171717;
        --muted: #645f57;
        --line: #d8d0c4;
        --card: #ffffff;
        --accent: #1d7669;
        --danger: #b73324;
        --shadow: 0 18px 36px rgb(31 28 23 / 12%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151413;
          --ink: #f4f0e9;
          --muted: #b8afa5;
          --line: #3a352e;
          --card: #201e1b;
          --accent: #78c6b7;
          --danger: #f18b79;
          --shadow: 0 18px 36px rgb(0 0 0 / 32%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      header {
        border-bottom: 1px solid var(--line);
        padding: 24px clamp(16px, 5vw, 56px) 18px;
      }

      .topbar {
        align-items: start;
        display: flex;
        gap: 18px;
        justify-content: space-between;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 5vw, 54px);
        line-height: 1;
        letter-spacing: 0;
      }

      .meta {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        font-size: 14px;
      }

      .toolbar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }

      .tabs button,
      .toolbar button {
        border-radius: 8px;
        min-height: 38px;
        padding: 7px 12px;
      }

      button[aria-pressed="true"],
      .toolbar button.active {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }

      main {
        padding: 24px clamp(16px, 5vw, 56px) 56px;
      }

      .grid {
        display: grid;
        gap: 22px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      }

      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .media {
        align-items: center;
        aspect-ratio: 3 / 4;
        background: #101010;
        display: flex;
        justify-content: center;
        min-height: 320px;
        overflow: hidden;
        position: relative;
      }

      img,
      video {
        display: block;
        height: 100%;
        max-width: 100%;
        object-fit: cover;
        width: 100%;
      }

      .delete {
        align-items: center;
        background: color-mix(in srgb, var(--danger) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--danger) 46%, var(--line));
        border-radius: 8px;
        color: var(--danger);
        display: inline-flex;
        font-size: 18px;
        font-weight: 700;
        height: 32px;
        justify-content: center;
        line-height: 1;
        padding: 0;
        width: 38px;
      }

      .delete:disabled {
        cursor: progress;
        opacity: 0.55;
      }

      .body {
        padding: 14px;
      }

      .body-top {
        align-items: center;
        display: flex;
        gap: 10px;
        justify-content: space-between;
      }

      .label {
        color: var(--danger);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .prompt {
        display: -webkit-box;
        font-size: 14px;
        margin: 8px 0 10px;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }

      a {
        color: var(--accent);
        overflow-wrap: anywhere;
      }

      .empty,
      .notice {
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        padding: 28px;
      }

      .notice {
        margin-bottom: 16px;
        padding: 12px 14px;
      }

      @media (max-width: 640px) {
        .topbar {
          display: block;
        }

        .toolbar {
          justify-content: flex-start;
          margin-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topbar">
        <div>
          <h1>Midjourney Public Archive</h1>
          <div class="meta">
            <span id="updated">No crawl yet</span>
            <span id="counts">0 items</span>
            <span id="status"></span>
          </div>
        </div>
        <div class="toolbar" aria-label="Archive actions">
          <button type="button" id="tokenButton">GitHub token</button>
          <button type="button" id="clearTokenButton">Clear token</button>
        </div>
      </div>
      <nav class="tabs" aria-label="Archive filters">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="images" aria-pressed="false">Images</button>
        <button type="button" data-filter="videos" aria-pressed="false">Videos</button>
        <button type="button" data-filter="styles" aria-pressed="false">Styles</button>
      </nav>
    </header>
    <main>
      <section id="archive" class="grid" aria-live="polite"></section>
    </main>
    <script>
      const OWNER = "dicacros-gif";
      const REPO = "mcodex";
      const BRANCH = "main";
      const DATA_PATH = "docs/data/midjourney.json";
      const TOKEN_KEY = "midjourneyArchiveGithubToken";

      const archive = document.getElementById("archive");
      const updated = document.getElementById("updated");
      const counts = document.getElementById("counts");
      const statusText = document.getElementById("status");
      const tokenButton = document.getElementById("tokenButton");
      const clearTokenButton = document.getElementById("clearTokenButton");
      const buttons = [...document.querySelectorAll("[data-filter]")];

      let archiveData = null;
      let items = [];
      let currentFilter = "all";
      let deletingId = null;

      const escapeText = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

      function setStatus(message) {
        statusText.textContent = message || "";
      }

      function token() {
        return localStorage.getItem(TOKEN_KEY) || "";
      }

      function updateTokenButtons() {
        tokenButton.classList.toggle("active", Boolean(token()));
      }

      function encodeBase64(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        bytes.forEach((byte) => {
          binary += String.fromCharCode(byte);
        });
        return btoa(binary);
      }

      function decodeBase64(value) {
        const binary = atob(String(value || "").replace(/\n/g, ""));
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      async function github(path, options = {}) {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${path}`, {
          ...options,
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token()}`,
            "X-GitHub-Api-Version": "2022-11-28",
            ...(options.headers || {})
          }
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.message || `GitHub API error ${response.status}`);
        }
        return response.json();
      }

      async function ensureToken() {
        if (token()) return true;
        const value = prompt("GitHub fine-grained token을 입력하세요. Contents: Read and write 권한이 필요합니다.");
        if (!value) return false;
        localStorage.setItem(TOKEN_KEY, value.trim());
        updateTokenButtons();
        return true;
      }

      function mediaHtml(item) {
        const source = item.asset_path || item.media_url || item.thumbnail_url;
        if (!source) return "";
        if (item.media_type === "video" && /\.(mp4|webm|mov)(\?|$)/i.test(source)) {
          return `<video src="${escapeText(source)}" controls preload="metadata"></video>`;
        }
        return `<img src="${escapeText(source)}" alt="">`;
      }

      function countsFor(nextItems) {
        return nextItems.reduce((acc, item) => {
          if (acc[item.tab] !== undefined) acc[item.tab] += 1;
          acc.total += 1;
          return acc;
        }, { images: 0, videos: 0, styles: 0, total: 0 });
      }

      function refreshMeta() {
        updated.textContent = archiveData?.updated_at
          ? `Updated ${new Date(archiveData.updated_at).toLocaleString()}`
          : "No crawl yet";
        counts.textContent = `${items.length} items`;
      }

      function render(filter = currentFilter) {
        currentFilter = filter;
        refreshMeta();
        const visible = filter === "all" ? items : items.filter((item) => item.tab === filter);
        if (!visible.length) {
          archive.className = "empty";
          archive.innerHTML = "저장된 항목이 없습니다. 크롤링이 성공하면 최신 항목이 위에서부터 쌓입니다.";
          return;
        }
        archive.className = "grid";
        archive.innerHTML = visible.map((item) => `
          <article>
            <div class="media">
              ${mediaHtml(item)}
            </div>
            <div class="body">
              <div class="body-top">
                <div class="label">${escapeText(item.tab)}${item.style_code ? ` · sref ${escapeText(item.style_code)}` : ""}</div>
                <button class="delete" type="button" data-delete="${escapeText(item.id)}" aria-label="Delete item" ${deletingId === item.id ? "disabled" : ""}>×</button>
              </div>
              <p class="prompt">${escapeText(item.prompt || item.title || item.id)}</p>
              <a href="${escapeText(item.page_url || item.media_url || "#")}" target="_blank" rel="noreferrer">Open source</a>
            </div>
          </article>
        `).join("");
      }

      async function loadArchive() {
        const response = await fetch("./data/midjourney.json", { cache: "no-store" });
        archiveData = await response.json();
        items = archiveData.items || [];
        render();
      }

      function repoMediaPath(item) {
        if (!item.asset_path || /^https?:\/\//i.test(item.asset_path)) return null;
        return `docs/${item.asset_path}`.replaceAll("//", "/");
      }

      async function deleteItem(itemId) {
        const item = items.find((candidate) => candidate.id === itemId);
        if (!item) return;
        if (!await ensureToken()) return;
        if (!confirm("이 항목을 홈페이지와 GitHub 저장소에서 삭제할까요?")) return;

        deletingId = itemId;
        setStatus("Deleting...");
        render();

        try {
          const ref = await github(`git/ref/heads/${BRANCH}`);
          const headSha = ref.object.sha;
          const commit = await github(`git/commits/${headSha}`);
          const dataFile = await github(`contents/${DATA_PATH}?ref=${BRANCH}`);
          const remoteData = JSON.parse(decodeBase64(dataFile.content));
          const nextItems = (remoteData.items || []).filter((candidate) => candidate.id !== itemId);

          if (nextItems.length === (remoteData.items || []).length) {
            throw new Error("이미 원격 데이터에서 삭제된 항목입니다.");
          }

          remoteData.items = nextItems;
          remoteData.counts = countsFor(nextItems);
          remoteData.updated_at = new Date().toISOString();

          const blob = await github("git/blobs", {
            method: "POST",
            body: JSON.stringify({
              content: encodeBase64(JSON.stringify(remoteData, null, 2) + "\n"),
              encoding: "base64"
            })
          });

          const tree = [
            {
              path: DATA_PATH,
              mode: "100644",
              type: "blob",
              sha: blob.sha
            }
          ];
          const mediaPath = repoMediaPath(item);
          if (mediaPath) {
            tree.push({
              path: mediaPath,
              mode: "100644",
              type: "blob",
              sha: null
            });
          }

          const nextTree = await github("git/trees", {
            method: "POST",
            body: JSON.stringify({
              base_tree: commit.tree.sha,
              tree
            })
          });
          const nextCommit = await github("git/commits", {
            method: "POST",
            body: JSON.stringify({
              message: `Delete Midjourney archive item ${itemId}`,
              tree: nextTree.sha,
              parents: [headSha]
            })
          });
          await github(`git/refs/heads/${BRANCH}`, {
            method: "PATCH",
            body: JSON.stringify({
              sha: nextCommit.sha,
              force: false
            })
          });

          archiveData = remoteData;
          items = nextItems;
          setStatus("Deleted");
        } catch (error) {
          alert(error.message || String(error));
          setStatus("Delete failed");
        } finally {
          deletingId = null;
          render();
        }
      }

      archive.addEventListener("click", (event) => {
        const button = event.target.closest("[data-delete]");
        if (!button) return;
        deleteItem(button.dataset.delete);
      });

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((candidate) => candidate.setAttribute("aria-pressed", String(candidate === button)));
          render(button.dataset.filter);
        });
      });

      tokenButton.addEventListener("click", () => {
        const value = prompt("GitHub fine-grained token을 입력하세요. Contents: Read and write 권한이 필요합니다.", token());
        if (!value) return;
        localStorage.setItem(TOKEN_KEY, value.trim());
        updateTokenButtons();
      });

      clearTokenButton.addEventListener("click", () => {
        localStorage.removeItem(TOKEN_KEY);
        updateTokenButtons();
      });

      updateTokenButtons();
      loadArchive().catch((error) => {
        archive.className = "empty";
        archive.innerHTML = escapeText(error.message || "데이터를 불러오지 못했습니다.");
      });
    </script>
  </body>
</html>
