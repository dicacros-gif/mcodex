<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Midjourney Public Archive</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f3ed;
        --ink: #171717;
        --muted: #645f57;
        --line: #d8d0c4;
        --card: #ffffff;
        --accent: #1d7669;
        --danger: #b73324;
        --shadow: 0 18px 36px rgb(31 28 23 / 12%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151413;
          --ink: #f4f0e9;
          --muted: #b8afa5;
          --line: #3a352e;
          --card: #201e1b;
          --accent: #78c6b7;
          --danger: #f18b79;
          --shadow: 0 18px 36px rgb(0 0 0 / 32%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }

      main {
        padding: 24px clamp(16px, 5vw, 56px) 56px;
      }

      .grid {
        display: grid;
        gap: 22px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      }

      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .media {
        align-items: center;
        aspect-ratio: 3 / 4;
        background: #101010;
        display: flex;
        justify-content: center;
        min-height: 320px;
        overflow: hidden;
        position: relative;
      }

      img,
      video {
        display: block;
        height: 100%;
        max-width: 100%;
        object-fit: cover;
        width: 100%;
      }

      .delete {
        align-items: center;
        background: color-mix(in srgb, var(--danger) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--danger) 46%, var(--line));
        border-radius: 8px;
        color: var(--danger);
        display: inline-flex;
        font-size: 18px;
        font-weight: 700;
        height: 32px;
        justify-content: center;
        line-height: 1;
        padding: 0;
        width: 38px;
      }

      .delete:disabled {
        cursor: progress;
        opacity: 0.55;
      }

      .body {
        padding: 14px;
      }

      .body-top {
        align-items: center;
        display: flex;
        gap: 10px;
        justify-content: space-between;
      }

      .label {
        color: var(--danger);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .prompt {
        display: -webkit-box;
        font-size: 14px;
        margin: 8px 0 10px;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }

      a {
        color: var(--accent);
        overflow-wrap: anywhere;
      }

      .empty,
      .notice {
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        padding: 28px;
      }

      .notice {
        margin-bottom: 16px;
        padding: 12px 14px;
      }

    </style>
  </head>
  <body>
    <main>
      <section id="archive" class="grid" aria-live="polite"></section>
    </main>
    <script>
      const DELETE_QUEUE_KEY = "midjourneyArchivePendingDeletes";

      const archive = document.getElementById("archive");
      const UUID_PATTERN = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;

      let archiveData = null;
      let items = [];

      const escapeText = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

      function pendingDeletes() {
        try {
          const value = JSON.parse(localStorage.getItem(DELETE_QUEUE_KEY) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function pendingDeleteIds() {
        return new Set(pendingDeletes().map((item) => item.id).filter(Boolean));
      }

      function savePendingDeletes(value) {
        localStorage.setItem(DELETE_QUEUE_KEY, JSON.stringify(value));
      }

      function mediaHtml(item) {
        const source = item.asset_path || item.media_url || item.thumbnail_url;
        if (!source) return "";
        if (item.media_type === "video" && /\.(mp4|webm|mov)(\?|$)/i.test(source)) {
          return `<video src="${escapeText(source)}" controls preload="metadata"></video>`;
        }
        return `<img src="${escapeText(source)}" alt="">`;
      }

      function uniqueContentKey(item) {
        const values = [
          item.id,
          item.asset_path,
          item.media_url,
          item.thumbnail_url,
          item.page_url
        ].filter(Boolean).join(" ");
        const publicId = values.match(UUID_PATTERN);
        if (publicId) return `uuid:${publicId[0].toLowerCase()}`;
        return `source:${item.media_url || item.thumbnail_url || item.asset_path || item.id}`;
      }

      function uniqueItems(sourceItems) {
        const seen = new Set();
        return sourceItems.filter((item) => {
          const key = uniqueContentKey(item);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function render() {
        const deletedIds = pendingDeleteIds();
        const visible = uniqueItems(items.filter((item) => !deletedIds.has(item.id)));
        if (!visible.length) {
          archive.className = "empty";
          archive.innerHTML = "저장된 항목이 없습니다. 크롤링이 성공하면 최신 항목이 위에서부터 쌓입니다.";
          return;
        }
        archive.className = "grid";
        archive.innerHTML = visible.map((item) => `
          <article>
            <div class="media">
              ${mediaHtml(item)}
            </div>
            <div class="body">
              <div class="body-top">
                <div class="label">${escapeText(item.tab)}${item.style_code ? ` · sref ${escapeText(item.style_code)}` : ""}</div>
                <button class="delete" type="button" data-delete="${escapeText(item.id)}" aria-label="Queue item for deletion">×</button>
              </div>
              <p class="prompt">${escapeText(item.prompt || item.title || item.id)}</p>
              <a href="${escapeText(item.page_url || item.media_url || "#")}" target="_blank" rel="noreferrer">Open source</a>
            </div>
          </article>
        `).join("");
      }

      async function loadArchive() {
        const response = await fetch("./data/midjourney.json", { cache: "no-store" });
        archiveData = await response.json();
        items = archiveData.items || [];
        render();
      }

      function queueDelete(itemId) {
        const item = items.find((candidate) => candidate.id === itemId);
        if (!item) return;
        const deleteKey = uniqueContentKey(item);
        const relatedItems = items.filter((candidate) => uniqueContentKey(candidate) === deleteKey);
        const queued = pendingDeletes();
        for (const relatedItem of relatedItems) {
          if (queued.some((candidate) => candidate.id === relatedItem.id)) continue;
          queued.push({
            id: relatedItem.id,
            tab: relatedItem.tab,
            asset_path: relatedItem.asset_path || null,
            queued_at: new Date().toISOString()
          });
        }
        savePendingDeletes(queued);
        render();
      }

      archive.addEventListener("click", (event) => {
        const button = event.target.closest("[data-delete]");
        if (!button) return;
        queueDelete(button.dataset.delete);
      });

      loadArchive().catch((error) => {
        archive.className = "empty";
        archive.innerHTML = escapeText(error.message || "데이터를 불러오지 못했습니다.");
      });
    </script>
  </body>
</html>
